<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yousef Portfolio</title>

    <style>
        .title-wrapper {
            position: absolute;
            top: 90px;

            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }


        .title-img {
            width: 520px;
            cursor: pointer;
            position: relative;
            z-index: 2;
            transition: 0.4s ease;
        }



        .title-wrapper:hover .title-img {
            transform: scale(1.05);
            filter: drop-shadow(0 0 20px white) drop-shadow(0 0 40px rgba(255, 255, 255, 0.6));
        }


        .side {
            position: absolute;
            width: 170px;

            opacity: 0;
            transition: 0.5s ease;

            border-radius: 18px;



            filter: drop-shadow(0 0 15px rgba(255, 255, 255, 0.8));

            transform: translateY(10px);
        }


        .left {
            left: 22%;
            transform: translateX(-70px) translateY(10px);
        }




        .right {
            right: 22%;
            transform: translateX(70px) translateY(10px);
        }


        .title-wrapper:hover .left {
            opacity: 1;
            transform: translateX(0) translateY(10px);
        }

        .title-wrapper:hover .right {
            opacity: 1;
            transform: translateX(0) translateY(10px);
        }







        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: sans-serif;
        }

        body {
            background: linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.6)),
                url("images.jpeg");
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }


        .top-title img {
            width: 100%;
            max-width: 700px;
            display: block;
            margin: auto;
            filter: drop-shadow(0 10px 20px rgba(0, 0, 0, 0.6));
        }

        .glow {
            text-shadow: 0 0 10px #ffffff, 0 0 20px #ffffff;
        }

        header {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            position: relative;
        }

        h1 {
            font-size: 3rem;
            opacity: 0;
            transform: translateY(-50px);
            animation: fadeDown 1s forwards;
            color: white;
        }

        p {
            margin-top: 10px;
            color: #ffffff;
            opacity: 0;
            animation: fadeIn 1s forwards;
            animation-delay: .5s;
        }

        button {
            margin-top: 20px;
            padding: 10px 20px;
            border: none;
            background: #222;
            color: #ffffff;
            border-radius: 20px;
            cursor: pointer;
            transition: .3s;
        }

        button:hover {
            box-shadow: 0 0 10px #ffffff, 0 0 20px #ffffff;
            transform: scale(1.1);
        }

        section {
            padding: 100px 20px;
            text-align: center;
            opacity: 0;
            transform: translateY(60px) translateZ(0);
            transition: 0.8s ease;
            color: white;
            backface-visibility: hidden;
            will-change: transform, opacity;
        }

        section.show {
            opacity: 1;
            transform: translateY(0);
        }

        .typing {
            border-right: 2px solid #ffffff;
            display: inline-block;
            white-space: nowrap;
            overflow: hidden;
        }

        .projects {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .card {
            position: relative;
            background: #5a5a5a;
            padding: 20px;
            border-radius: 15px;
            width: 250px;
            color: white;
            cursor: pointer;
            transition: 0.3s;
            overflow: visible;
        }

        .card:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px white;
        }


        .card::after {
            content: "";
            position: absolute;
            width: 140px;
            height: 140px;

            background-size: cover;
            background-position: center;

            border-radius: 15px;

            opacity: 0;
            transition: 0.4s ease;

            filter: drop-shadow(0 0 15px rgba(255, 255, 255, 0.8));

            pointer-events: none;
        }


        .left-card::after {
            content: "";
            background: url("p1.png") center/cover;
            left: -160px;
            top: 50%;
            transform: translateY(-50%) translateX(-20px);
            transition: 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .left-card:hover::after {
            opacity: 1;
            transform: translateY(-50%) translateX(0);
            transition: 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
        }


        .top-card::after {
            background: url("p2.png") center/cover;
            top: -160px;
            left: 50%;
            transform: translateX(-50%) translateY(-20px);
            transition: 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .top-card:hover::after {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
            transition: 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
        }


        .right-card::after {
            background: url("p3.png") center/cover;
            right: -160px;
            top: 50%;
            transform: translateY(-50%) translateX(20px);
            transition: 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .right-card:hover::after {
            opacity: 1;
            transform: translateY(-50%) translateX(0);
            transition: 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .profile {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            background: url('profile.png') center/cover;
            margin: 20px auto;
            box-shadow: 0 0 30px #777;
            transition: .5s;
        }

        .profile:hover {
            transform: scale(1.1) rotateY(180deg);
        }

        @keyframes fadeDown {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
            }


        }

        .projects a {
            text-decoration: none;
            color: inherit;
        }


        .card {
            display: block;
            /* مهم */
            width: 300px;
            height: 200px;
            border-radius: 15px;
            border: 1px solid white;
            text-decoration: none;
            /* يشيل الخط الأزرق */
            color: white;
            overflow: hidden;
            position: relative;
            transition: 0.3s;
        }

        /* يرجّع حجم الخط الطبيعي */
        .card h2 {
            font-size: 20px;
            margin: 0;
        }

        /* hover الأساسي */
        .card:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
        }




        .hover-img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;

            opacity: 0;
            transition: 0.4s ease;
        }

        /* تظهر بالصورة */
        .card:hover .hover-img {
            opacity: 1;
        }





        /* الكارد */
        .card {
            display: flex;
            justify-content: center;
            align-items: center;

            width: 300px;
            height: 200px;

            border-radius: 15px;
            border: 1px solid white;
            text-decoration: none;
            color: white;

            position: relative;
            overflow: hidden;

            font-family: Arial, sans-serif;
            /* توحيد الخط */
            transition: 0.3s;
        }

        /* النص في النص مظبوط */
        .title {
            font-size: 22px;
            z-index: 2;
        }

        /* hover عام */
        .card:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
        }

        /* الصورة */
        .hover-img {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: cover;
            /* مهم عشان الصورة تبان كاملة */

            opacity: 0;
            transition: 0.5s ease;
        }

        /* 👇 اتجاهات الظهور */

        /* من اليمين */
        .hover-img.right {
            transform: translateX(100%);
        }

        .card:hover .hover-img.right {
            transform: translateX(0);
            opacity: 1;
        }

        /* من الشمال */
        .hover-img.left {
            transform: translateX(-100%);
        }

        .card:hover .hover-img.left {
            transform: translateX(0);
            opacity: 1;
        }

        /* من فوق */
        .hover-img.top {
            transform: translateY(-100%);
        }

        .card:hover .hover-img.top {
            transform: translateY(0);
            opacity: 1;
        }






        .card:hover .title {
            opacity: 0;
        }




        /* container */
        .projects {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin-top: 100px;
        }

        /* الكارد */
        .card {
            width: 250px;
            height: 150px;

            display: flex;
            justify-content: center;
            align-items: center;

            border: 1px solid white;
            border-radius: 12px;

            color: white;
            text-decoration: none;

            position: relative;
            overflow: hidden;

            font-family: Arial;
            transition: 0.3s;
        }

        /* النص */
        .title {
            z-index: 2;
            font-size: 20px;
            transition: 0.3s;
        }

        /* hover عام */
        .card:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.25);
        }

        /* الصورة */
        .hover-img {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: cover;

            opacity: 0;
            transition: 0.5s ease;
        }

        /* 👇 الاتجاهات */

        /* من الشمال */
        .left {
            transform: translateX(-100%);
        }

        .card:hover .left {
            transform: translateX(0);
            opacity: 1;
        }

        /* من اليمين */
        .right {
            transform: translateX(100%);
        }

        .card:hover .right {
            transform: translateX(0);
            opacity: 1;
        }

        /* من فوق */
        .top {
            transform: translateY(-100%);
        }

        .card:hover .top {
            transform: translateY(0);
            opacity: 1;
        }

        /* اختفاء النص عند hover */
        .card:hover .title {
            opacity: 0;
        }





        .hover-img {
            filter: blur(5px);
        }

        .card:hover .hover-img {
            filter: blur(0);
        }




        /* container */
        .projects {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin-top: 120px;
        }

        /* كل project */
        .project {
            position: relative;
            text-align: center;
        }

        /* الزرار */
        .btn {
            display: inline-block;
            padding: 10px 20px;
            border: 1px solid white;
            border-radius: 8px;
            color: white;
            text-decoration: none;
            font-size: 16px;
            transition: 0.3s;
        }

        /* hover زرار */
        .btn:hover {
            background: white;
            color: black;
        }

        /* الصورة (برا الكارد) */
        .preview {
            position: absolute;
            bottom: -20px;
            /* تبدأ تحت */
            left: 50%;
            transform: translateX(-50%) translateY(20px);

            width: 160px;
            /* حجم أصغر */
            border-radius: 10px;

            opacity: 0;
            transition: 0.4s ease;
            pointer-events: none;
        }

        /* ✨ تظهر لفوق */
        .project:hover .preview {
            opacity: 1;
            transform: translateX(-50%) translateY(-120px);
        }
    </style>
</head>

<body>




    <div class="title-wrapper">
        <img class="title-img" src="title.png" alt="title">

        <img class="side left" src="left.png" alt="left">
        <img class="side right" src="right.png" alt="right">
    </div>

    <header>
        <h1 class="glow">Hi, I'm Yousef</h1>
        <p>Full Stack Developer | Designer | Editor 👨‍💻</p>
        <div class="profile"></div>
        <button onclick="window.location.href='contact.html'">Contact Me</button>
    </header>

    <section class="reveal">
        <h2 class="glow">About Me</h2>
        <p id="typingText" class="typing"></p>
    </section>

    <section class="reveal">
        <h2 class="glow">Projects</h2>
        <div class="projects">

            <div class="project">
                <a href="project1.html" class="btn">Project 1</a>
                <img src="p3.png" class="preview">
            </div>

            <div class="project">
                <a href="Surfer.html" class="btn">Project 2</a>
                <img src="silver1.jpeg" class="preview">
            </div>

            <div class="project">
                <a href="project3.html" class="btn">Project 3</a>
                <img src="p2.png" class="preview">
            </div>

        </div>

        </div>
        </div>
    </section>

    <script>
        const reveals = document.querySelectorAll('.reveal');

        window.addEventListener('scroll', () => {
            reveals.forEach(sec => {
                const top = sec.getBoundingClientRect().top;
                if (top < window.innerHeight - 100) {
                    sec.classList.add('show');
                } else {
                    sec.classList.remove('show');
                }
            });
        });

        const text = "🚀 Full Stack Web Developer 🎨 Graphic Designer 🎬 Professional Editor Building creative & high-performance digital experiences.";
        const el = document.getElementById("typingText");
        let i = 0;
        let typing = false;

        function startTyping() {
            if (typing) return;
            typing = true;
            el.textContent = "";
            i = 0;

            function type() {
                if (i < text.length) {
                    el.textContent += text.charAt(i);
                    i++;
                    setTimeout(type, 20);
                }
            }
            type();
        }

        window.addEventListener('scroll', () => {
            const top = el.getBoundingClientRect().top;

            if (top < window.innerHeight - 100 && top > 0) {
                startTyping();
            } else {
                typing = false;
                el.textContent = "";
            }
        });

        /* ===== REAL 3D TITLE MOVE ===== */
        const title = document.querySelector(".top-title");

        document.addEventListener("mousemove", (e) => {
            const x = (e.clientX / window.innerWidth - 0.5) * 30;
            const y = (e.clientY / window.innerHeight - 0.5) * -30;

            title.style.transform = `rotateY(${x}deg) rotateX(${y}deg)`;




        });







    </script>

</body>

</html>
