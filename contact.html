<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Yousef</title>

    <style>
        /* Animations */
        @keyframes fadeDown {
            from {
                opacity: 0;
                transform: translateY(-40px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(40px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Apply animations */
        h1 {
            opacity: 0;
            animation: fadeDown 1s forwards;
        }

        .profile {
            opacity: 0;
            animation: fadeUp 1s forwards;
            animation-delay: .3s;
        }

        .links a {
            opacity: 0;
            animation: fadeUp 1s forwards;
        }

        /* delay لكل لينك */
        .links a:nth-child(1) {
            animation-delay: .5s;
        }

        .links a:nth-child(2) {
            animation-delay: .7s;
        }

        .links a:nth-child(3) {
            animation-delay: .9s;
        }

        .links a:nth-child(4) {
            animation-delay: 1.1s;
        }

        .back {
            opacity: 0;
            animation: fadeUp 1s forwards;
            animation-delay: 1.3s;
        }

        body {
            background: linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.6)),
                url("images.jpeg");

            background-size: cover;
            background-position: center;
            font-family: sans-serif;
            text-align: center;
            padding-top: 80px;
        }





        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 0 0 10px #ffffff;
        }

        .profile {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            background: url('profile.png') center/cover;
            margin: 20px auto;
            box-shadow: 0 0 25px #777;
            border: 3px solid rgba(255, 255, 255, 0.2);
            transition: .4s;
        }

        .profile:hover {
            transform: scale(1.1);
            box-shadow: 0 0 40px #ffffff;
        }

        .links {
            margin-top: 30px;
        }

        a {
            display: block;
            margin: 15px auto;
            width: 200px;
            padding: 12px;
            background: #1a1a1a;
            border-radius: 25px;
            color: #aaa;
            text-decoration: none;
            font-size: 16px;
            transition: .3s;
        }

        a:hover {
            color: #fff;
            transform: scale(1.05);
            box-shadow: 0 0 15px #ffffff;
        }

        .back {
            margin-top: 40px;
            display: inline-block;
            font-size: 14px;
            color: #ffffff;
        }

        .back:hover {
            color: #fff;
        }
    </style>

</head>

<body>

    <h1>Contact Me</h1>

    <div class="profile"></div>

    <div class="links">
        <a href="https://wa.me/201146164155" target="_blank">WhatsApp</a>
        <a href="https://www.tiktok.com/@golden.yousef" target="_blank">TikTok</a>
        <a href="https://www.instagram.com/yousefharbyhd/" target="_blank">Instagram</a>
        <a href="tel:+201146164155">Call Me</a>
    </div>

    <a class="back" href="index.html">← Back to Home</a>

</body>

</html>
